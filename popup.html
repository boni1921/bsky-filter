<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quietsky</title>
    <style>
      body {
        margin: 0;
        padding: 12px 14px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        min-width: 240px;
        color: #222;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 650;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }
      .toggle-row span {
        line-height: 1.3;
      }
      .toggle-row small {
        display: block;
        font-weight: 400;
        color: #666;
        font-size: 11px;
        margin-top: 2px;
      }
      .toggle-row input {
        width: 1.15rem;
        height: 1.15rem;
        margin: 0;
        accent-color: #1083fe;
        cursor: pointer;
        flex-shrink: 0;
      }
      .divider {
        height: 1px;
        background: #e5e5e5;
        margin: 4px 0 12px;
      }
      #status,
      #mute-status {
        margin: 4px 0 0;
        font-size: 12px;
        color: #227a3a;
        min-height: 1em;
      }
      #mute-status.error {
        color: #a33;
      }
      .mute-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .mute-actions {
        display: flex;
        gap: 6px;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 4px 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #expired-list {
        display: none;
        margin: 0 0 8px;
        padding: 0;
        list-style: none;
        max-height: 160px;
        overflow: auto;
      }
      #expired-list.open {
        display: block;
      }
      #expired-list li {
        padding: 4px 0;
        border-bottom: 1px solid #eee;
        line-height: 1.3;
      }
      #expired-list small {
        display: block;
        color: #666;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>Hide engagement counts</h1>
    <label class="toggle-row">
      <span>
        Likes
        <small>Feed + post detail</small>
      </span>
      <input type="checkbox" id="hideLikes" checked />
    </label>
    <label class="toggle-row">
      <span>
        Reposts
        <small>Includes quote counts</small>
      </span>
      <input type="checkbox" id="hideReposts" checked />
    </label>
    <label class="toggle-row">
      <span>
        Bookmarks
        <small>Save counts on posts</small>
      </span>
      <input type="checkbox" id="hideBookmarks" checked />
    </label>
    <div class="divider"></div>
    <label class="toggle-row">
      <span>
        Show mine only
        <small>Keep counts on your posts</small>
      </span>
      <input type="checkbox" id="showOwnOnly" />
    </label>
    <p id="status" role="status"></p>
    <div class="divider"></div>
    <h1>Muted words</h1>
    <div class="mute-head">
      <span id="expired-count">— expired</span>
      <div class="mute-actions">
        <button type="button" id="view-expired">View</button>
        <button type="button" id="renew-all">Renew all</button>
      </div>
    </div>
    <ul id="expired-list"></ul>
    <p id="mute-status" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
